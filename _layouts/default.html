<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

  <script>
    (function () {
      const stored = localStorage.getItem('theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', stored || (prefersLight ? 'light' : 'dark'));
    })();
  </script>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research/' %}class="active"{% endif %}>Research</a>
        <a href="{{ '/writing/' | relative_url }}" {% if page.url contains '/writing/' %}class="active"{% endif %}>Writing</a>
        <a href="{{ '/teaching/' | relative_url }}" {% if page.url contains '/teaching/' %}class="active"{% endif %}>Teaching</a>
        <a href="{{ '/cv/' | relative_url }}" {% if page.url contains '/cv/' %}class="active"{% endif %}>CV</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme">
          <span class="sun">☼</span><span class="moon">☾</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    {{ content }}
  </main>

  <footer class="container footer">
    <span>© {{ 'now' | date: '%Y' }} {{ site.title }}</span>
    <span class="dot">·</span>
    <a href="mailto:as4458@cornell.edu">as4458@cornell.edu</a>
  </footer>

  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
