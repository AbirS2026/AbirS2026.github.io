---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="eyebrow">Writing</p>
    <h1>{{ page.title }}</h1>
    <p class="muted">
      {{ page.date | date: "%B %-d, %Y" }}
      {% if page.categories and page.categories.size > 0 %}
        · {% for category in page.categories %}<span class="tag">{{ category }}</span>{% endfor %}
      {% endif %}
    </p>
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
